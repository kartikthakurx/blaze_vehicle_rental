<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/stylenew.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .container07 {
            margin: 150px auto 40px auto;
            width: 500px;
            padding: 40px;
            border-radius: 12px;
            background: url('assets/image/backiee-269771.jpg') no-repeat center/cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            color: white;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-content {
            width: 100%;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.3s;
        }

        .input-group:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .input-group i {
            margin-right: 10px;
            color: #ff9800;
        }

        .input-group input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 16px;
        }

        .form-content button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2f7fe9;
            color: white;
            cursor: pointer;
            font-size: 18px;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
            animation-delay: 0.9s;
        }

        .signin-option {
            margin-top: 15px;
            font-size: 18px;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
            animation-delay: 1.2s;
        }

        .signin-option a {
            color: white;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container07 {
                width: 90%;
                height: auto;
                padding: 50px 20px;
            }
        }
    </style>
</head>

<body>
    <header>

        <nav>
            <div class="logo"><a href="index.php">🚘 Blaze Vehicle Rental</a></div>
        </nav>
    </header>

 <form action="back/login.php" method="POST">
    <div class="container07">
        <div class="form-content">
            <h2>Sign In</h2>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Sign In</button>
            
            <p class="signin-option">Don't have an account? <a href="signup.html">Sign Up</a></p>

        </div>
    </div>
 </form>
  
</body>
</html>
